services:
  lb:
    image: haproxy:2.9-alpine
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - sock:/run/sock
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "30MB"
    networks:
      - rinha-net

  api1:
    image: gdcavalcante/rinha-2026-c-exact-i16:35000-balanced45-th2
    environment:
      SOCKET_PATH: /run/sock/api1.sock
      THREADS: "1"
    volumes:
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      - rinha-net

  api2:
    image: gdcavalcante/rinha-2026-c-exact-i16:35000-balanced45-th2
    environment:
      SOCKET_PATH: /run/sock/api2.sock
      THREADS: "1"
    volumes:
      - sock:/run/sock
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "160MB"
    networks:
      - rinha-net

networks:
  rinha-net:
    driver: bridge

volumes:
  sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=1777
