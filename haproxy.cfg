global
    maxconn 20000
    nbthread 2
    tune.bufsize 8192
    tune.maxrewrite 1024
    log stdout format raw local0 warning

defaults
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    option dontlognull

frontend fe
    bind *:9999 backlog 8192
    default_backend be

backend be
    balance roundrobin
    server api1 /run/sock/api1.sock maxconn 10000
    server api2 /run/sock/api2.sock maxconn 10000
